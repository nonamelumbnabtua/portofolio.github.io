<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jam Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ring" id="ring"><span id="ringTxt">Alarm!</span><button onclick="stopRing()">Matikan</button></div>
<div class="wrap">
<h1>Jam <span>Digital</span></h1>
<div class="tabs">
<button class="tab active" data-p="clock">Jam</button>
<button class="tab" data-p="alarm">Alarm</button>
<button class="tab" data-p="world">Jam Dunia</button>
<button class="tab" data-p="stopwatch">Stopwatch</button>
</div>

<section class="panel active" id="clock">
<div class="big" id="cTime">00:00:00</div>
<div class="sub" id="cDate"></div>
<div class="sub" id="cZone"></div>
</section>

<section class="panel" id="alarm">
<div class="row" style="margin-top:0">
<input type="time" id="aTime" value="07:00">
<input type="text" id="aLabel" placeholder="Label (opsional)" maxlength="30">
<button class="btn" onclick="addAlarm()">Tambah</button>
</div>
<div id="aList" style="margin-top:12px"></div>
</section>

<section class="panel" id="world">
<div class="row" style="margin-top:0">
<select id="wSel"></select>
<button class="btn" onclick="addZone()">Tambah</button>
</div>
<div id="wList" style="margin-top:12px"></div>
</section>

<section class="panel" id="stopwatch">
<div class="big" id="sTime">00:00.00</div>
<div class="row">
<button class="btn" id="sGo" onclick="swToggle()">Mulai</button>
<button class="btn ghost" onclick="swLap()">Lap</button>
<button class="btn ghost" onclick="swReset()">Reset</button>
</div>
<div id="laps" style="margin-top:16px"></div>
</section>
</div>

<script src="script.js"></script>
</body>
</html>
